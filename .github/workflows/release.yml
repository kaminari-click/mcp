name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test:cov
      - run: npm run build
      - name: Publish to npm (with provenance)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build the MCPB bundle
        run: npm run build:mcpb-bundle
      - name: Pack the .mcpb archive
        run: npx --yes @anthropic-ai/mcpb pack . kaminari-click-mcp.mcpb
      - name: Attach the .mcpb to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: kaminari-click-mcp.mcpb
          generate_release_notes: true
